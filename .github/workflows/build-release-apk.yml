# Release APK — ProGuarded, shrunk, and ready to sideload.
#
# GitHub's runners have 16 GB RAM and 4 cores, which is what R8 actually needs; a 2 GB developer
# box will get OOM-killed mid-minification. That is why this lives in CI.
#
# Signing
# -------
# The APK is signed so it can actually be installed. Two paths, in priority order:
#
#   1. Repository secrets — set these in Settings → Secrets and variables → Actions:
#        TYPORB_KEYSTORE_BASE64   base64 of your .jks   (base64 -w0 typorb-release.jks | pbcopy)
#        TYPORB_STORE_PASSWORD
#        TYPORB_KEY_ALIAS
#        TYPORB_KEY_PASSWORD
#      This is the path to use for anything you intend to keep or ship: the key stays yours, so
#      every future build upgrades the installed app instead of forcing a reinstall.
#
#   2. Fallback — if those secrets are absent, the workflow generates an ephemeral key for that
#      run. The APK is installable, but because the key is thrown away afterwards, every future
#      release is signed differently and Android will refuse to upgrade over it: the user has to
#      uninstall first. Fine for personal sideloading, not for distribution.
#
# Model weights
# -------------
# The Whisper ONNX files are gitignored, so a clean checkout has none. We fetch them; if that
# fails the build still succeeds, because the app downloads and SHA-256-verifies the same weights
# on first run instead. A slim release is a legitimate outcome, just a different one.

name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble ProGuarded release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the SDK and cmdline-tools. We deliberately do not use
      # `android-actions/setup-android` here: its `sdkmanager tools` call fails on current runners
      # because the legacy `tools` package was removed from the SDK repository.
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to ./gradlew
        run: chmod +x ./gradlew

      - name: Fetch Whisper weights for offline mode
        continue-on-error: true
        run: |
          sh tools/fetch-whisper-model.sh || {
            echo "::warning::Could not fetch the Whisper weights. Building without them; the app" \
                 "will download and verify them on first run instead."
            rm -f app/src/main/assets/whisper/*.onnx app/src/main/assets/whisper/tokenizer.json || true
          }

      - name: Configure release signing key
        env:
          TYPORB_KEYSTORE_BASE64: ${{ secrets.TYPORB_KEYSTORE_BASE64 }}
          TYPORB_STORE_PASSWORD: ${{ secrets.TYPORB_STORE_PASSWORD }}
          TYPORB_KEY_ALIAS: ${{ secrets.TYPORB_KEY_ALIAS }}
          TYPORB_KEY_PASSWORD: ${{ secrets.TYPORB_KEY_PASSWORD }}
        run: |
          set -eu
          KEYSTORE_PATH="$PWD/typorb-release.jks"

          if [ -n "${TYPORB_KEYSTORE_BASE64:-}" ] && [ -n "${TYPORB_STORE_PASSWORD:-}" ]; then
            echo "$TYPORB_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            KEY_ALIAS="${TYPORB_KEY_ALIAS:-typorb}"
            KEY_PASSWORD="${TYPORB_KEY_PASSWORD:-$TYPORB_STORE_PASSWORD}"
            echo "Using the repository signing key."
            SIGNING_KIND="persistent"
          else
            # Ephemeral key: installable, but every run produces a different signature, so the app
            # cannot be upgraded in place later. Documented in the workflow header.
            KEY_ALIAS="typorb-ephemeral"
            KEY_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Typorb, OU=Build, O=Typorb, L=-, ST=-, C=ZZ" > /dev/null
            echo "::warning::No signing secret configured. Generated an ephemeral key for this run."
            echo "::warning::Each release will need to be uninstalled before installing the next one."
            SIGNING_KIND="ephemeral"
          fi

          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "SIGNING_KIND=$SIGNING_KIND" >> "$GITHUB_ENV"
          # Never let the key material reach the build log.
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEY_PASSWORD" > /dev/null \
            && echo "Keystore is readable."

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # AGP names the output app-release.apk when signing is configured and
      # app-release-unsigned.apk when it is not; accept whichever landed.
      - name: Verify and publish release APK
        id: verify
        run: |
          set -eu
          APK=""
          for candidate in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          do
            if [ -f "$candidate" ]; then APK="$candidate"; break; fi
          done

          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced. See the build step for the failure."
            exit 1
          fi

          # An unsigned APK cannot be installed, so fail loudly rather than ship a dud.
          case "$APK" in
            *unsigned*)
              echo "::error::The release APK is unsigned and cannot be installed."
              exit 1
              ;;
          esac

          SIZE="$(du -h "$APK" | cut -f1)"
          DIGEST="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "Release APK: $APK ($SIZE)"
          echo "SHA-256: $DIGEST"
          echo "Signing: ${SIGNING_KIND:-unknown}"

          BADGING="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package|^sdkVersion|targetSdkVersion|^native-code" || true

          # The APK must name the commit it was built from. Without this check a release can be
          # published from a stale artifact, which is exactly what happened once: versionCode and
          # versionName were fixed strings, so a release went out containing the previous release's
          # binary and nothing could tell the two apart. The build stamp now makes that detectable,
          # and this makes it fatal.
          EXPECTED="$GITHUB_SHA"
          SHORT="$(printf '%s' "$EXPECTED" | cut -c1-7)"
          # Tokenised rather than pattern-matched: pulling a capture group out through YAML, a shell
          # quote and a regex costs three levels of backslash escaping and gets it wrong quietly.
          # Splitting on whitespace makes `versionName=` its own token, and anchoring with ^ keeps
          # it from matching `platformBuildVersionName=`.
          STAMP="$(echo "$BADGING" | tr ' ' '\n' | grep -m1 '^versionName=' | cut -d= -f2 | tr -d "'")"
          echo "Build stamp: $STAMP (expected to contain $SHORT)"
          case "$STAMP" in
            *"$SHORT"*) echo "::notice::APK build stamp matches commit $SHORT" ;;
            *)
              echo "::error::APK build stamp '$STAMP' does not contain commit $SHORT. Release artifact is stale."
              exit 1
              ;;
          esac

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_stamp=$STAMP" >> "$GITHUB_OUTPUT"
          # `SIGNING_KIND` is exported through GITHUB_ENV by the signing step, so it is already in
          # scope here. It is echoed as a step output purely for the job summary.

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 90

      # A GitHub Release is the stable, shareable download, so a release event publishes the APK
      # this run just built and verified.
      #
      # This replaces a manual `gh run download -n app-release` followed by `gh release upload`.
      # That step was unsafe: given only an artifact name, gh resolves the newest run that has it,
      # and a release was once published from the *previous* commit's build — a saved-state fix
      # shipped as a byte-identical copy of the release before it, so the crash it was meant to fix
      # could not have been fixed. Publishing from inside the run removes the ambiguity entirely:
      # the artifact attached is always the one this job produced.
      #
      # Ephemeral signing still counts as publishable. The alternative was worse — a release with
      # no APK at all — and the consequence is visible and recoverable (uninstall before upgrading),
      # whereas a silently stale artifact is neither. Set the TYPORB_* secrets to sign properly.
      - name: Attach to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            "${{ steps.verify.outputs.apk_path }}#Typorb-${TAG}-release.apk" --clobber
          echo "::notice::Attached ${{ steps.verify.outputs.apk_stamp }} to $TAG"