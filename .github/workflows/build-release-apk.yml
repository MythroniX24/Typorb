# Production release APK CI workflow.
#
# Builds ONE signed, minified, self-contained release APK for GitHub-hosted downloads.
# Requires: (1) a release keystore + keystore.properties, (2) offline ONNX weights.
#
# Prerequisites before you can download this APK:
#   1. Create a release keystore (.jks) and a keystore.properties file:
#        storeFile=/absolute/path/to/typorb-release.jks
#        storePassword=<strong-store-password>
#        keyAlias=typorb
#        keyPassword=<key-password>
#      Commit keystore.properties is NOT optional for a signed release. It's gitignored
#      by default, so keep it out of git and set it as a repository secret OR commit it
#      (the workflow reads it from disk, not from a secret).
#   2. The offline ONNX weights (whisper-tiny.onnx, whisper-tiny-decoder.onnx,
#      tokenizer.json) are gitignored. Fetch them with:
#        sh tools/fetch-whisper-model.sh
#      (needs ~140MB of space). The release workflow runs this automatically.
#
# Usage:
#   - Push to `main`: triggers automatically.
#   - Workflow dispatch: run manually from the Actions tab.
#   - Artifact: `app-release` (~110-170 MB), upload to GitHub Releases.
#
# Known limitations (not CI errors):
#   - Android 13+ requires a targetSdk of 33+ / platformBuildVersionCode 33+ for 64-bit only.
#   - 32-bit (armeabi-v7a) is NOT built for a 64-bit targetSdk; use buildTools 34.
#   - Store password / key password are written to the .gradle/ file-properties cache
#     on the runner. This workflow does not expose those secrets.

name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a build that has already produced an artifact.
concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The offline ONNX weights are gitignored, so we must NOT rely on a clean
          # checkout carrying them. We fetch them below instead.
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the SDK and cmdline-tools. We deliberately do
      # not use `android-actions/setup-android` here: its `sdkmanager tools` call fails on
      # current runners because the legacy `tools` package was removed from the SDK repository.
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$RUNNER_TEMP/android-sdk"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # Caches the Gradle distribution and all dependency artifacts.
      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to ./gradlew
        run: chmod +x ./gradlew

      # --- Pre-fetch offline model weights (needed for release) -------------------
      # These files are gitignored, so a clean checkout has no weights. Fetch them so the
      # release build can package them. Fail the build if the model server is unreachable
      # so the developer knows offline weights are required for a release.
      - name: Pre-fetch Whisper model (offline mode)
        run: |
          if [ -f "tools/fetch-whisper-model.sh" ] && sh tools/fetch-whisper-model.sh; then
            echo "Offline model ready."
          else
            echo "FATAL: offline ONNX weights missing and fetch failed."
            echo "Run 'sh tools/fetch-whisper-model.sh' locally (needs ~140MB) or commit the"
            echo "weights so the release build can package them."
            exit 1
          fi

      # --- Verify release signing key is present ----------------------------------
      # The release build only signs when keystore.properties exists. If it's missing,
      # the CI would produce an unsigned APK and also fail later with a confusing error.
      - name: Verify release signing key (keystore.properties)
        run: |
          if [ ! -f "keystore.properties" ]; then
            echo "FATAL: keystore.properties missing. The release build type needs a signing"
            echo "key. Create keystore.properties with storeFile/storePassword/keyAlias/keyPassword."
            echo "This file is gitignored by default — do NOT commit it."
            exit 1
          fi
          echo "Release signing key found."

      # --- Build release APK -----------------------------------------------------
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "release APk not found — build failed"
            echo "full log is in 'Build release APK' step above"
            exit 1
          fi
          echo "Release APK ready: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
